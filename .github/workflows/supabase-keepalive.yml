name: Supabase Keep Alive Ping (Robust)

on:
  schedule:
    - cron: "0 0 */3 * *"  # every 3 days
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase with Retry
        run: |
          set -e

          URL="${{ secrets.SUPABASE_URL }}/rest/v1/bill_history?select=id&limit=1"
          KEY="${{ secrets.SUPABASE_KEY }}"

          MAX_RETRIES=5
          COUNT=0
          SUCCESS=0

          echo "Starting Supabase ping..."

          while [ $COUNT -lt $MAX_RETRIES ]; do
            COUNT=$((COUNT+1))
            echo "Attempt $COUNT of $MAX_RETRIES"

            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
              "$URL" \
              -H "apikey: $KEY" \
              -H "Authorization: Bearer $KEY")

            echo "HTTP Response: $RESPONSE"

            if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
              echo "✅ Supabase ping successful"
              SUCCESS=1
              break
            fi

            WAIT=$((COUNT * 5))
            echo "❌ Failed. Retrying in $WAIT seconds..."
            sleep $WAIT
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "🚨 All retry attempts failed!"
            exit 1
          fi

      - name: Final Status
        run: echo "Ping job completed"
