name: Supabase Daily Keep Alive

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Check last ping
        id: check
        run: |
          set -e

          URL="${{ secrets.SUPABASE_URL }}"
          KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"

          DATA=$(curl -s \
            "$URL/rest/v1/system_health?id=eq.1&select=last_ping_at" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")

          LAST=$(echo "$DATA" | jq -r '.[0].last_ping_at // empty')

          if [ -z "$LAST" ]; then
            echo "RUN_PING=1" >> $GITHUB_ENV
            exit 0
          fi

          LAST_TS=$(date -d "$LAST" +%s)
          NOW_TS=$(date +%s)

          DIFF=$(( (NOW_TS - LAST_TS) / 86400 ))

          echo "Days since last ping: $DIFF"

          if [ "$DIFF" -ge 5 ]; then
            echo "RUN_PING=1" >> $GITHUB_ENV
          else
            echo "RUN_PING=0" >> $GITHUB_ENV
          fi

      - name: Call Edge Function
        if: env.RUN_PING == '1'
        run: |
          set -e

          FUNCTION_URL="${{ secrets.SUPABASE_FUNCTION_URL }}"
          SECRET="${{ secrets.KEEPALIVE_SECRET }}"

          HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" \
            -H "x-keepalive-secret: $SECRET" \
            "$FUNCTION_URL")

          BODY=$(cat response.txt)

          echo "HTTP: $HTTP_CODE"
          echo "BODY: $BODY"

          if [ "$HTTP_CODE" -ne 200 ] || [ "$BODY" != "alive" ]; then
            echo "ERROR=$BODY" >> $GITHUB_ENV
            exit 1
          fi

      - name: Update last ping time
        if: success() && env.RUN_PING == '1'
        run: |
          set -e

          curl -s -f -X PATCH \
            "${{ secrets.SUPABASE_URL }}/rest/v1/system_health?id=eq.1" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"last_ping_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

      - name: Telegram Alert
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="🚨 Supabase Keep Alive FAILED%0A%0AURL: ${{ secrets.SUPABASE_FUNCTION_URL }}%0AError: $ERROR"

      - name: Success log
        if: success()
        run: echo "✅ Keep alive OK"
