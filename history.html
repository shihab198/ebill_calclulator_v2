<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="historyPageTitle">Billing History</title>


  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>

<div class="container">

  <header>
    <div>
      <h1 data-i18n="historyPageTitle">Billing History</h1>
      <p data-i18n="cloudSyncedRecords">Cloud Synced Records</p>
    </div>

    <div class="header-actions">
      <div class="top-controls">
        <button class="btn secondary" id="langToggle" type="button">English</button>
        <button class="btn secondary" id="themeToggle" type="button">Light</button>
      </div>
      <button class="btn secondary" id="csvExportBtn" data-i18n="exportCSV">Export CSV</button>
      <a href="index.html" class="btn secondary" data-i18n="calculator">Calculator</a>
    </div>
  </header>


  <section class="card">
    <div id="historyContainer"></div>
  </section>

</div>


<script src="i18n.js"></script>
<script src="supabase.js"></script>
<script src="history.js"></script>

</body>
</html>
